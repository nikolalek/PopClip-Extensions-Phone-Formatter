name: libphonenumber update check

# Daily check: compare bundled libphonenumber-max.js against npm latest.
# If stale -> rebuild in a read-only job, then open a PR from a separate
# write-enabled job that never executes the upstream package.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libphonenumber-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.check.outputs.latest }}
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Compare versions
        id: check
        run: |
          bundled=$(grep -o 'libphonenumber-js@[0-9][0-9.]*' phone-formatter.popclipext/libphonenumber-max.js 2>/dev/null | head -1 | cut -d@ -f2)
          latest=$(python3 -c "import json,urllib.request; print(json.load(urllib.request.urlopen('https://registry.npmjs.org/libphonenumber-js/latest', timeout=30))['version'])")
          case "$latest" in
            ''|*[!0-9.]*|.*|*.|*..*) echo "unexpected version: $latest" >&2; exit 1 ;;
          esac
          echo "bundled=$bundled" >> "$GITHUB_OUTPUT"
          printf 'latest=%s\n' "$latest" >> "$GITHUB_OUTPUT"
          if [ "$bundled" != "$latest" ]; then echo "stale=true" >> "$GITHUB_OUTPUT"; else echo "stale=false" >> "$GITHUB_OUTPUT"; fi

      - name: Rebuild bundle if stale
        if: steps.check.outputs.stale == 'true'
        env:
          LIBLATEST: ${{ steps.check.outputs.latest }}
        run: npm ci --ignore-scripts && make update-lib LIBLATEST="$LIBLATEST" && make zip

      - name: Upload rebuilt files
        if: steps.check.outputs.stale == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lib-update
          path: |
            phone-formatter.popclipext/libphonenumber-max.js
            phone-formatter.popclipextz
          if-no-files-found: error

  open-pr:
    needs: build
    if: needs.build.outputs.stale == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lib-update
          path: .

      - name: Verify zip matches the reviewed sources
        run: |
          test "$(unzip -Z1 phone-formatter.popclipextz | sort)" = "$(printf '%s\n' 'phone-formatter.popclipext/Config.js' 'phone-formatter.popclipext/libphonenumber-max.js' | sort)"
          unzip -p phone-formatter.popclipextz phone-formatter.popclipext/Config.js | diff -q - phone-formatter.popclipext/Config.js
          unzip -p phone-formatter.popclipextz phone-formatter.popclipext/libphonenumber-max.js | cmp - phone-formatter.popclipext/libphonenumber-max.js

      - name: Open update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.build.outputs.latest }}
        run: |
          BR="auto/libphonenumber-$VER"
          if [ -n "$(gh pr list --state open --head "$BR" --json number -q '.[].number')" ]; then
            echo "PR for $BR is already open, nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add phone-formatter.popclipext/libphonenumber-max.js phone-formatter.popclipextz
          git commit -m "chore: update libphonenumber-max.js to $VER"
          git push --force -u origin "$BR"
          gh pr create --title "chore: libphonenumber-max.js $VER" --body "Automated rebuild of the bundled max library (npm \`libphonenumber-js@$VER\` via esbuild) and of the release zip. \`make test\` passed during rebuild — see workflow log."
